<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GoArchivist</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="app-shell">
        <header class="navbar navbar-dark bg-dark app-header">
            <div class="container-fluid">
                <a class="navbar-brand mb-0" href="/">GoArchivist</a>
                <nav aria-label="Основное меню">
                    <a class="nav-link text-light" href="/">Главная</a>
                </nav>
            </div>
        </header>

        <div class="app-main">
            <aside class="app-sidebar border-end" aria-label="Панель управления">
                <div class="p-3">
                    <h2 class="h6">Панель управления</h2>
                    <p class="text-muted small mb-0">Здесь появятся элементы управления.</p>
                </div>
            </aside>

            <main class="app-content">
                <div class="container-fluid p-4">
                    <h1>GoArchivist</h1>
                    <p class="lead">Архиватор почтовых вложений</p>
                </div>
            </main>
        </div>

        <footer class="app-footer border-top bg-light">
            <div class="app-status" role="status">
                <span class="status-indicator" aria-hidden="true"></span>
                Готово
            </div>

            <a class="btn btn-outline-secondary btn-sm" href="/settings" aria-label="Настройки">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                     fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M9.605 1.05a1.5 1.5 0 0 0-3.21 0l-.18.72a5.7 5.7 0 0 0-.9.52l-.7-.24a1.5 1.5 0 0 0-1.97 1.13l-.18.72a1.5 1.5 0 0 0 1.03 1.75l.68.23a5.7 5.7 0 0 0 0 1.04l-.68.23a1.5 1.5 0 0 0-1.03 1.75l.18.72a1.5 1.5 0 0 0 1.97 1.13l.7-.24c.28.2.58.37.9.52l.18.72a1.5 1.5 0 0 0 3.21 0l.18-.72c.32-.15.62-.32.9-.52l.7.24a1.5 1.5 0 0 0 1.97-1.13l.18-.72a1.5 1.5 0 0 0-1.03-1.75l-.68-.23a5.7 5.7 0 0 0 0-1.04l.68-.23a1.5 1.5 0 0 0 1.03-1.75l-.18-.72a1.5 1.5 0 0 0-1.97-1.13l-.7.24a5.7 5.7 0 0 0-.9-.52l-.18-.72ZM8 10.25A2.25 2.25 0 1 1 8 5.75a2.25 2.25 0 0 1 0 4.5Z"/>
                </svg>
                <span class="ms-1">Настройки</span>
            </a>
        </footer>
    </div>

    <script src="/static/js/bootstrap.min.js"></script>
</body>
</html>
