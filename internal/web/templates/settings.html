<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Настройки — GoArchivist</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="app-shell">
        <header class="navbar navbar-dark bg-dark app-header">
            <div class="container-fluid">
                <a class="navbar-brand mb-0" href="/">GoArchivist</a>
                <nav aria-label="Основное меню">
                    <a class="nav-link text-light" href="/">Главная</a>
                </nav>
            </div>
        </header>

        <div class="app-main">
            <aside class="app-sidebar border-end" aria-label="Разделы администрирования">
                <div class="p-3">
                    <h2 class="h6">Администрирование</h2>
                    <nav class="nav nav-pills flex-column">
                        <a class="nav-link {{if eq .Section "general"}}active{{end}}"
                           href="/settings">Общее</a>
                        <a class="nav-link {{if eq .Section "logs"}}active{{end}}"
                           href="/settings?section=logs">Логи</a>
                    </nav>
                </div>
            </aside>

            <main class="app-content">
                <div class="container-fluid p-4">
                    {{if eq .Section "logs"}}
                    <h1>Логи</h1>
                    <p class="text-muted">Просмотр и очистка журналов будут добавлены позже.</p>
                    {{else}}
                    <h1>Общие настройки</h1>
                    <p class="text-muted">Здесь будут общие настройки приложения.</p>
                    {{end}}
                </div>
            </main>
        </div>

        <footer class="app-footer border-top bg-light">
            <div class="app-status" role="status">
                <span class="status-indicator" aria-hidden="true"></span>
                Готово
            </div>
            <a class="btn btn-outline-secondary btn-sm" href="/">На главную</a>
        </footer>
    </div>

    <script src="/static/js/bootstrap.min.js"></script>
</body>
</html>
